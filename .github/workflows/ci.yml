name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Formatting and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets --locked

  msrv:
    name: Minimum supported Rust 1.85
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --workspace --all-targets --locked

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  build-and-install:
    name: Release and installation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/test_install.sh
      - run: bash scripts/test_units.sh
      - run: bash scripts/test_release_reproducible.sh
      - run: bash scripts/build_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rustguard-0.1.0-rc.1-${{ matrix.os }}-linux-x86_64
          path: dist/*
          if-no-files-found: error

  integration:
    name: Privileged Linux networking
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install network test tools
        run: sudo apt-get update && sudo apt-get install -y wireguard-tools iproute2 iputils-ping nftables python3
      - run: cargo build --workspace --locked
      - run: sudo bash scripts/test_single_peer.sh
      - run: sudo bash scripts/test_client_networking.sh
      - run: sudo bash scripts/test_lifecycle.sh
      - run: sudo bash scripts/test_multi_peer.sh
